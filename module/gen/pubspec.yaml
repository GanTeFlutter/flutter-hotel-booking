name: gen
description: "gen"
version: 0.0.1
homepage:
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"


dependencies:
  
  lottie: ^3.3.2 

  envied: ^1.3.1

  equatable: ^2.0.7

  flutter_svg: ^2.2.1

  json_annotation: ^4.9.0

  freezed_annotation: ^3.1.0 

  google_maps_flutter: ^2.14.0




dev_dependencies:
  
  flutter_test:
    sdk: flutter

  
  
  very_good_analysis: ^10.0.0
  
  build_runner: ^2.9.0

  envied_generator: ^1.3.1
  
  json_serializable: ^6.11.1
 
  flutter_gen_runner: ^5.12.0

  freezed: ^3.2.3     

flutter_gen:
  output: lib/src/assets/

  colors:
    inputs:
      - assets/color/colors.xml
 


  fonts:
    enabled: true  

  
  integrations:
    image: true
    flutter_svg: true
    lottie: true



flutter:

  assets:
    - assets/image/
    - assets/lottie/
    - assets/color/colors.xml 
    - assets/svg/
    - assets/icon/bottom_navigation_bar_icon/
    - assets/json/
  
  
  
  
  fonts:
  - family: Jost
    fonts:
      - asset: assets/fonts/jost/Jost-VariableFont_wght.ttf
      - asset: assets/fonts/jost/Jost-Italic-VariableFont_wght.ttf
        style: italic

  - family: Inter
    fonts:
      - asset: assets/fonts/inter/Inter-VariableFont_opsz,wght.ttf
      - asset: assets/fonts/inter/Inter-Italic-VariableFont_opsz,wght.ttf
        style: italic   

  - family: PlusJakartaSans
    fonts:
      - asset: assets/fonts/plus_jakarta/PlusJakartaSans-VariableFont_wght.ttf
      - asset: assets/fonts/plus_jakarta/PlusJakartaSans-Italic-VariableFont_wght.ttf
        style: italic   
        
  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
